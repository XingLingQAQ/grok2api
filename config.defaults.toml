[grok]
temporary = true
stream = true
thinking = true
dynamic_statsig = true
filter_tags = ["xaiartifact","xai:tool_usage_card","grok:render"]
timeout = 120
base_proxy_url = ""
asset_proxy_url = ""
cf_clearance = ""
max_retry = 3
retry_status_codes = [401,429,403]
# 重试退避配置
retry_backoff_base = 0.5
retry_backoff_factor = 2.0
retry_backoff_max = 30.0
retry_budget = 90.0
# 流空闲超时配置 (秒)
stream_idle_timeout = 45.0
video_idle_timeout = 90.0

[app]
app_url = "http://127.0.0.1:6683"
app_key = "grok2api"
api_key = ""
image_format = "url"
video_format = "html"

[token]
auto_refresh = true
refresh_interval_hours = 8
super_refresh_interval_hours = 2
fail_threshold = 5
save_delay_ms = 500
reload_interval_sec = 30

[cache]
enable_auto_clean = true
limit_mb = 1024

[performance]
assets_max_concurrent = 25
media_max_concurrent = 50
usage_max_concurrent = 25
assets_delete_batch_size = 10
assets_batch_size = 10
assets_max_tokens = 1000
usage_batch_size = 50
usage_max_tokens = 1000
nsfw_max_concurrent = 10
nsfw_batch_size = 50
nsfw_max_tokens = 1000

[register]
# 是否启用注册功能（启用后会初始化浏览器池）
enabled = false
# 邮箱服务配置
mail_api_key = "mk_dZvkBRJYNqMnhupv7C-OBa17k6cPzOgP"
mail_domain = "669698.xyz"
mail_api_url = "https://mail.xingling.one"
# Turnstile Solver 配置
turnstile_solver_url = "http://127.0.0.1:5072"
turnstile_solver_threads = 5
turnstile_headless = true
turnstile_timeout = 60.0
# 注册并发数
register_concurrent = 8
# 注册成功后自动导入 Token 到 Token 管理
auto_import_tokens = true


